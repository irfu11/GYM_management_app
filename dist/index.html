<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>IRONPEAK | Gym Management</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    
    <!-- Custom Styles -->
  <script type="module" crossorigin src="/assets/index-ChI0WZRk.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-DL3tIstj.css">
</head>
<body>
    <div id="ironpeak-app">
        <!-- Login Screen -->
        <div id="login-screen">
            <div class="login-card">
                <div class="login-logo display-font">IRONPEAK</div>
                <div class="login-sub">GYM MANAGEMENT SYSTEM</div>
                <div id="login-error" class="error-text hidden">Invalid credentials</div>
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="login-user" class="input-field" placeholder="admin">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="login-pass" class="input-field" placeholder="••••••••">
                </div>
                <button class="btn-yellow" onclick="app.login()">Access Dashboard</button>
                <div class="hint">Demo: admin / gym123</div>
            </div>
        </div>

        <!-- Main App Interface -->
        <div id="main-app" class="app-container hidden">
            <aside class="sidebar">
                <div class="logo-area">
                    <div class="logo display-font"><i class="ti ti-stretching"></i> IRONPEAK</div>
                </div>
                <nav class="nav-list">
                    <div class="nav-item active" data-view="dashboard" onclick="app.handleNav(this)">
                        <i class="ti ti-layout-dashboard"></i> Dashboard
                    </div>
                    <div class="nav-item" data-view="members" onclick="app.handleNav(this)">
                        <i class="ti ti-users"></i> Members
                    </div>
                    <div class="nav-item" data-view="dues" onclick="app.handleNav(this)">
                        <i class="ti ti-receipt-2"></i> Dues & Payments
                    </div>
                    <div class="nav-item" data-view="plans" onclick="app.handleNav(this)">
                        <i class="ti ti-shield-check"></i> Plans
                    </div>
                </nav>
                <div class="logout-btn" onclick="app.logout()">
                    <i class="ti ti-logout"></i> Logout
                </div>
            </aside>

            <main class="main-content">
                <header class="top-bar">
                    <div class="page-title display-font" id="current-page-title">Dashboard</div>
                    <div class="user-badge">
                        <div class="status-dot"></div>
                        <span>Manager Access</span>
                    </div>
                </header>

                <div class="scroll-area" id="view-container">
                    <!-- Dynamic views injected here -->
                </div>
            </main>
        </div>

        <!-- Modal Overlay -->
        <div id="modal-overlay" class="hidden">
            <div class="modal-content">
                <h2 class="display-font" id="modal-title" style="font-size: 28px; margin-bottom: 30px;">Add Member</h2>
                <form id="member-form" onsubmit="event.preventDefault(); app.saveMember();">
                    <input type="hidden" id="f-id">
                    <div class="modal-grid">
                        <div class="input-group full-width">
                            <label>Full Name</label>
                            <input type="text" id="f-name" class="input-field" required>
                        </div>
                        <div class="input-group">
                            <label>Phone Number</label>
                            <input type="tel" id="f-phone" class="input-field" required>
                        </div>
                        <div class="input-group">
                            <label>Age</label>
                            <input type="number" id="f-age" class="input-field">
                        </div>
                        <div class="input-group full-width">
                            <label>Email Address</label>
                            <input type="email" id="f-email" class="input-field">
                        </div>
                        <div class="input-group">
                            <label>Membership Plan</label>
                            <select id="f-plan" class="input-field">
                                <option value="Basic">Basic (₹800)</option>
                                <option value="Standard">Standard (₹1200)</option>
                                <option value="Premium" selected>Premium (₹2000)</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Start Date</label>
                            <input type="date" id="f-start" class="input-field">
                        </div>
                        <div class="input-group">
                            <label>Duration (Months)</label>
                            <select id="f-dur" class="input-field">
                                <option value="1">1 Month</option>
                                <option value="3">3 Months</option>
                                <option value="6">6 Months</option>
                                <option value="12">12 Months</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Payment Status</label>
                            <select id="f-pay" class="input-field">
                                <option value="paid">Paid</option>
                                <option value="pending">Pending</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn-yellow">Save Member Data</button>
                        <button type="button" class="btn-outline" onclick="app.closeModal()">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
</body>
</html>
