<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>IRONPEAK | Gym Management</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="./favicon.ico">
    <script>
        // Temporary app stub to queue calls made before app.js loads.
        if (!window.app) {
            window.__app_queue = [];
            window.app = new Proxy({}, {
                get(target, prop) {
                    return function(...args) {
                        window.__app_queue.push({ fn: prop, args });
                    };
                }
            });
        }
    </script>
</head>
<body>
    <div id="ironpeak-app">
        <!-- Login Screen -->
        <div id="login-screen">
            <div class="login-card">
                <div class="login-logo display-font">IRONPEAK</div>
                <div class="login-sub">PREMIUM GYM MANAGEMENT</div>
                <div id="login-error" class="error-text hidden">INVALID CREDENTIALS</div>
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="login-user" class="input-field" placeholder="admin">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="login-pass" class="input-field" placeholder="••••••••">
                </div>
                <button class="btn-cyan" onclick="app.login()">ACCESS DASHBOARD</button>
            </div>
        </div>

        <!-- Main App Interface -->
        <div id="main-app" class="app-container hidden">
            <header class="top-bar">
                <div class="user-trigger" onclick="app.handleNav(null, 'profile')">
                    <img src="https://images.unsplash.com/photo-1594381898411-846e7d193883?auto=format&fit=crop&q=80" id="user-avatar-small" alt="Profile">
                </div>
                <div class="search-bar">
                    <i class="ti ti-search"></i>
                    <input type="text" placeholder="Search members, plans..." oninput="app.search(this.value)">
                </div>
                <div class="user-trigger" onclick="app.openModal()">
                    <i class="ti ti-plus"></i>
                </div>
            </header>

            <main class="main-content">
                <div class="scroll-area" id="view-container">
                    <!-- Dynamic views injected here -->
                </div>
            </main>

            <!-- Bottom Navigation -->
            <nav class="bottom-tabs">
                <div class="tab-item active" data-view="dashboard" onclick="app.handleNav(this)">
                    <i class="ti ti-smart-home"></i>
                    <span>Overview</span>
                </div>
                <div class="tab-item" data-view="members" onclick="app.handleNav(this)">
                    <i class="ti ti-users"></i>
                    <span>Members</span>
                </div>
                <div class="tab-item" data-view="dues" onclick="app.handleNav(this)">
                    <i class="ti ti-receipt-2"></i>
                    <span>Payments</span>
                </div>
                <div class="tab-item" data-view="profile" onclick="app.handleNav(this)">
                    <i class="ti ti-user-circle"></i>
                    <span>Admin</span>
                </div>
            </nav>
        </div>

        <!-- Modal Overlay -->
        <div id="modal-overlay" class="hidden">
            <div class="modal-content">
                <h2 class="display-font" id="modal-title" style="font-size: 24px; margin-bottom: 24px; color: var(--accent)">Add Member</h2>
                <form id="member-form" onsubmit="event.preventDefault(); app.saveMember();">
                    <input type="hidden" id="f-id">
                    <div style="display: flex; flex-direction: column; gap: 16px;">
                        <div class="input-group">
                            <label>Full Name</label>
                            <input type="text" id="f-name" class="input-field" required>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                            <div class="input-group">
                                <label>Phone</label>
                                <input type="tel" id="f-phone" class="input-field" required>
                            </div>
                            <div class="input-group">
                                <label>Age</label>
                                <input type="number" id="f-age" class="input-field">
                            </div>
                        </div>
                        <div class="input-group">
                            <label>Email (optional)</label>
                            <input type="email" id="f-email" class="input-field">
                        </div>
                        <div class="input-group">
                            <label>Membership Plan</label>
                            <select id="f-plan" class="input-field">
                                <option value="Basic">Basic (₹800)</option>
                                <option value="Standard">Standard (₹1200)</option>
                                <option value="Premium" selected>Premium (₹2000)</option>
                            </select>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                            <div class="input-group">
                                <label>Start Date</label>
                                <input type="date" id="f-start" class="input-field">
                            </div>
                            <div class="input-group">
                                <label>Duration</label>
                                <select id="f-dur" class="input-field">
                                    <option value="1">1 Month</option>
                                    <option value="3">3 Months</option>
                                    <option value="6">6 Months</option>
                                    <option value="12">12 Months</option>
                                </select>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>Payment Status</label>
                            <select id="f-pay" class="input-field">
                                <option value="paid">Paid</option>
                                <option value="pending">Pending</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn-cyan">Save Data</button>
                        <button type="button" class="btn-outline" onclick="app.closeModal()">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>
